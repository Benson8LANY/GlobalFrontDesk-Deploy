name: email-automation-customer

services:
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    environment:
      POSTGRES_DB: mail_automation
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-mail_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?POSTGRES_OWNER_PASSWORD is required}
    volumes: ["customer-postgres:/var/lib/postgresql"]
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER_USER:-mail_owner} -d mail_automation"]
      interval: 3s
      timeout: 5s
      retries: 30
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  migrate:
    image: ${MIGRATE_IMAGE:?MIGRATE_IMAGE is required}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_OWNER_USER:-mail_owner}:${POSTGRES_OWNER_PASSWORD}@postgres:5432/mail_automation
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_OWNER_USER:-mail_owner}:${POSTGRES_OWNER_PASSWORD}@postgres:5432/mail_automation
      RUNTIME_DATABASE_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}
    depends_on: { postgres: { condition: service_healthy } }
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: "no"

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    working_dir: /tmp
    command: ["bun", "/app/server.js"]
    env_file: .env.customer
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://mail_runtime:${POSTGRES_RUNTIME_PASSWORD}@postgres:5432/mail_automation
      API_PORT: 3003
      API_BASE_URL: https://${FQDN:?FQDN is required}
      WEB_ORIGIN: https://${FQDN}
      GMAIL_PUBSUB_AUDIENCE: https://${FQDN}/webhooks/gmail
      APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
      RELEASE_CHANNEL: ${RELEASE_CHANNEL:?RELEASE_CHANNEL is required}
      UPDATE_STATUS_PATH: /release-state/update-status.json
      KNOWLEDGE_STORAGE_DIR: /knowledge-files
    volumes:
      - ${STATE_DIR:-/var/lib/email-automation}:/release-state:ro
      - ${STATE_DIR:-/var/lib/email-automation}/knowledge-files:/knowledge-files
    expose: ["3003"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3003/health/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 12
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped

  worker:
    image: ${WORKER_IMAGE:?WORKER_IMAGE is required}
    env_file: .env.customer
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://mail_runtime:${POSTGRES_RUNTIME_PASSWORD}@postgres:5432/mail_automation
      WORKER_HEALTH_PORT: 3004
      EMBEDDING_URL: http://embeddings:80
      API_BASE_URL: https://${FQDN}
      APP_VERSION: ${APP_VERSION}
      RELEASE_CHANNEL: ${RELEASE_CHANNEL}
      KNOWLEDGE_STORAGE_DIR: /knowledge-files
    depends_on:
      migrate: { condition: service_completed_successfully }
      embeddings: { condition: service_started }
    expose: ["3004"]
    volumes:
      - ${STATE_DIR:-/var/lib/email-automation}/knowledge-files:/knowledge-files:ro
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3004/health/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 12
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped

  embeddings:
    image: ${EMBEDDINGS_IMAGE:?EMBEDDINGS_IMAGE is required}
    command: ["--model-id", "intfloat/multilingual-e5-small", "--port", "80"]
    volumes: ["embedding-models:/data"]
    expose: ["80"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3003
      HOSTNAME: 0.0.0.0
      PORT: 3000
    expose: ["3000"]
    depends_on: { api: { condition: service_healthy } }
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped

  caddy:
    image: ${CADDY_IMAGE:?CADDY_IMAGE is required}
    environment:
      FQDN: ${FQDN}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: { web: { condition: service_started } }
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  customer-postgres:
  embedding-models:
  caddy-data:
  caddy-config:
